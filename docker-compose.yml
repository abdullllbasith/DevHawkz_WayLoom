name: wayloom

# web, api, and planning remain deferred placeholders for TASK-01-07.
# postgres is the only PostgreSQL service. Do not add a second database service.

services:
  web:
    profiles: ["deferred"]
    image: busybox:1.36.1
    command: ["true"]
  api:
    profiles: ["deferred"]
    image: busybox:1.36.1
    command: ["true"]
  # Single PostgreSQL definition. TASK-01-07 adopts this service.
  # web, api, and planning remain deferred placeholders until that task.
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: wayloom_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the untracked .env}
      POSTGRES_DB: postgres
      WAYLOOM_APP_PASSWORD: ${WAYLOOM_APP_PASSWORD:?Set WAYLOOM_APP_PASSWORD in the untracked .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wayloom_postgres_data:/var/lib/postgresql
      - ./database/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wayloom_bootstrap -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  planning:
    profiles: ["deferred"]
    image: busybox:1.36.1
    command: ["true"]

volumes:
  wayloom_postgres_data:
