name: wayloom

# Development orchestration. Host commands remain npm run dev, npm run dev:api, and python -m app.
# postgres is the only PostgreSQL service.

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: development
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: "4000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://wayloom_app:${WAYLOOM_APP_PASSWORD:?Set WAYLOOM_APP_PASSWORD in the untracked .env}@postgres:5432/wayloom_development
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: wayloom_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the untracked .env}
      POSTGRES_DB: postgres
      WAYLOOM_APP_PASSWORD: ${WAYLOOM_APP_PASSWORD:?Set WAYLOOM_APP_PASSWORD in the untracked .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wayloom_postgres_data:/var/lib/postgresql
      - ./database/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wayloom_bootstrap -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  planning:
    build:
      context: .
      dockerfile: services/planning/Dockerfile
    environment:
      NODE_ENV: development
      PLANNING_HOST: 0.0.0.0
      PLANNING_PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  wayloom_postgres_data:
