[project]
name = "wayloom-planning"
version = "0.0.0"
description = "WayLoom FastAPI planning service foundation. Planning algorithms are not implemented."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
